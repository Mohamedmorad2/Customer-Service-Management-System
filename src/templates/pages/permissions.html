<!-- manage_permissions.html -->
<h1>Manage User Permissions</h1>
<form method="post">
    {% csrf_token %}
    <table>
        <tr>
            <th>User</th>
            <th>Edit</th>
            <th>Delete</th>
            <th>View</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.username }}</td>
            <td><input type="checkbox" name="can_edit_{{ user.id }}" {% if user.userpermission.can_edit %}checked{% endif %}></td>
            <td><input type="checkbox" name="can_delete_{{ user.id }}" {% if user.userpermission.can_delete %}checked{% endif %}></td>
            <td><input type="checkbox" name="can_view_{{ user.id }}" {% if user.userpermission.can_view %}checked{% endif %} disabled></td>
        </tr>
        {% endfor %}
    </table>
    <button type="submit">Save Permissions</button>
</form>
