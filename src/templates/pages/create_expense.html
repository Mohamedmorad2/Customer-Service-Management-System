{% extends 'base.html' %}
{% load static %}
{% block title %}Create Expense{% endblock %}
{% block favicon %}{% static 'Images/wallet.png' %}{% endblock %}
{% block content %}

    <!-- Start content -->
    <div class="content" id="mainContent">
        <h1 style="text-align: center; margin-top:15px; color:#023047;">Create Expense</h1>
        <div class="container">
            <form method='POST' enctype="multipart/form-data">
                {% csrf_token %}
                <div class="box"  style=" margin-left: 80px;">
                    <label for="Product" style="margin-left: 0px;">Select Product</label>
                    <select id="Product" name="Product" required>
                        <option value="">Select Product</option>
                        <option value="Mug">Mug</option>
                        <option value="Magic Mug">Magic Mug</option>
                        <option value="T-shirt printing">T-shirt printing</option>
                        <option value="Tableau">Tableau</option>
                        <option value="Sticker">Sticker</option>
                    </select>
                </div>

                <div class="box" style="margin-left: 40px;">
                    <label for="Quantity">Quantity</label>
                    <input type="text" id="quantity" name="Quantity" placeholder="Enter Quantity" required>    
                </div>
            

                <div class="box" style="margin-left: 40px;">
                    <label for="Product Price">Product Price</label>
                    <input type="text" id=" product_price" name="product_price" placeholder="Enter  Product Price " required>
                </div>

                <div class="box" style="margin-left: 40px;">
                    <label for=" Purchase Date">Purchase Date</label>
                    <input type="date" id="purchase_date" name="purchase_date" required>
                </div>

                <div class="box" style="margin-left: 40px;">
                    <label for="Total Price">Total Price</label>
                    <input type="text" id="total_price" name="Total_Price"  placeholder="Enter  Total Price " required>
                </div>

                <div class="box"  style=" margin-left: 80px;">
                    <label for="status" style="margin-left: 0px;">Status</label>
                    <select id="status" name="Status" required>
                        <option value="">Select Status</option>
                        <option value="request">Request</option>
                        <option value="pending">Pending</option>
                        <option value="approve">Approve</option>
                        <option value="cancel">Cancel</option>
                    </select>
                </div>

                <div class="box" style="margin-left: 40px;">
                    <label id='label_img' for="imageUpload">Invoice image</label>
                    <input type="file" id="imageUpload" name="image" accept="image/*" required><br><br>
                </div>

            
                <div class="box" style="margin-left: 40px;">
                    <label for="comment">Notes</label>
                    <textarea id="notes" name="notes" rows="4" cols="50" placeholder="Notes"></textarea><br><br>
                </div>
            
                <button  type="submit" id="submit">Save</button>
            </form>
        </div>
    </div>
    <!-- End content -->


{%  endblock %}
