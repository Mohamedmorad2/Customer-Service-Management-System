{% extends 'base.html' %}
{% load static %}
{% block title %}Create User{% endblock %}
{% block favicon %}{% static 'Images/add-user.png' %}{% endblock %}
{% block content %}

    <!-- Start content -->
    <div class="content" id="mainContent">
        <h1 style="text-align: center; margin-top:15px; color:#023047;">Create User</h1>
            <!-- Start Add User Form -->
            <div class="container">
                <form method="POST" id="User_form">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" id="submit">Save</button>
                </form>
                
            </div>
            <!-- End Add User Form -->
    </div>
    <!-- End content -->

{%  endblock %}
