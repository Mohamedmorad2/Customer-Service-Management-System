{% extends 'base.html' %}
{% load static %}
{% block title %}Create Review Order{% endblock %}
{% block favicon %}{% static 'Images/complaint.png' %}{% endblock %}
{% block content %}

<div class="content" id="mainContent">

    <h1 style="text-align: center; margin-top:15px; color:#023047;">
        Create Review for Order {{ order.order_type }}
    </h1>
    {%include 'parts/alerts.html'%}
    <div class="container">
        <form id="review_form" method='POST' enctype="multipart/form-data">
            {% csrf_token %}
            <div class="box">
                <label>Order Name</label>
                <input type="text" name="name" value="{{ order.name }}" readonly>
            </div>

            <div class="box">
                <label>Order Type</label>
                <input type="text" name="order_type" value="{{ order.order_type }}" readonly>
            </div>

            <div class="box">
                <label>Product Price</label>
                <input type="text" name="product_price" value="{{ order.product_price }}" readonly>
            </div>

            <div class="box">
                <label>Shipping Price</label>
                <input type="text" name="shipping_price" value="{{ order.shipping_price }}" readonly>
            </div>

            <div class="box" style="margin-left: 50px;">
                <label  style="margin-left: 0px;" for="evaluation_authority">Evaluation Authority</label>
                <select id="evaluation_authority" name="evaluation_authority" required>
                    <option value="">Select</option>
                    <option value="Phone">Phone</option>
                    <option value="WhatsApp">WhatsApp</option>
                    <option value="Facebook">Facebook</option>
                    <option value="Instagram">Instagram</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="box" style="margin-left: 40px; width:290px;">
                <label id='label_img' for="imageUpload">Screenshot</label>
                <input type="file" id="imageUpload" name="image" accept="image/*"><br><br>
            </div>

            <div class="box">
                <label for="review">Review</label>
                <textarea id="review" name="review" rows="4" cols="50" placeholder="Write your review here"></textarea>
            </div>
                

            <button type="submit">Submit Review</button>
        </form>
    </div>
</div>

{% endblock %}
